---
- name: Azure Migration Lab configuration
  hosts: local
  gather_facts: false

  tasks:
    - name: Verify Ansible execution
      ansible.builtin.debug:
        msg: "Ansible configuration completed successfully"

    - name: Verify Docker
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Verify kubectl
      ansible.builtin.command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Verify Helm
      ansible.builtin.command: helm version
      register: helm_version
      changed_when: false

    - name: Show tool versions
      ansible.builtin.debug:
        msg:
          - "{{ docker_version.stdout }}"
          - "{{ kubectl_version.stdout }}"
          - "{{ helm_version.stdout }}"