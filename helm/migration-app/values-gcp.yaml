# GCP clone of values-prod.yaml. Differences from Azure prod:
#   - keyVault disabled: no Key Vault CSI / workload identity available here,
#     so postgres password comes from a plain values-supplied secret instead
#     (chart's built-in postgresql-secret.yaml template covers this when
#     keyVault.enabled=false; the value itself is passed with --set-file at
#     deploy time, never committed).
#   - ingress-nginx IS installed here (its own ClusterRole/RoleBinding were
#     created via a one-time, narrowly-scoped, time-boxed container.admin
#     grant on the CI service account - granted immediately before `helm
#     install ingress-nginx`, revoked immediately after; day-to-day deploys
#     run under the permanent container.developer role). Service is
#     ClusterIP behind the ingress, matching the Azure prod topology (single
#     public IP, path-based routing) instead of its own direct LoadBalancer.
#   - ingress host is "" (catch-all, same pattern as values-prod.yaml's
#     first host entry) since this clone has no DNS - reachable by the
#     ingress-nginx-controller Service's raw external IP only.
#   - operations.enabled is true: operations-rbac.yaml's Role/RoleBinding
#     (namespace-scoped: pods/services/events/deployments/ingresses) and
#     ClusterRole/ClusterRoleBinding (cluster-scoped: nodes only, read-only)
#     were created via the same one-time, time-boxed container.admin grant
#     used for ingress-nginx - granted immediately before `helm upgrade`,
#     revoked immediately after. The console's ServiceAccount needs no GCP
#     IAM identity for this (Kubernetes RBAC is cluster-native, unrelated to
#     cloud IAM), so no Workload Identity annotation is set here.
#   - replicaCount 1 and trimmed cpu/memory requests: this cluster's single
#     e2-medium node has only 940m allocatable CPU, and GKE's own system
#     DaemonSets (Dataplane V2/netd, CSI node drivers, logging/metrics
#     agents) already consume ~860m of that on a standard (non-Autopilot)
#     node - leaving very little room. Scaling to a second node or a bigger
#     machine type would fix this more robustly but roughly doubles compute
#     cost; trimming requests keeps this within the already-provisioned,
#     already-approved terraform sizing.
replicaCount: 1
environment: prod

image:
  repository: europe-west1-docker.pkg.dev/migration-lab-gcp-clone/migration-lab/migration-app
  tag: "content-1788917430"
  pullPolicy: IfNotPresent

containerPort: 8000

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

databaseSecretName: migration-postgresql-secret

postgresql:
  enabled: true
  image: postgres:16
  database: migrationdb
  username: migrationuser
  password: "" # supplied via --set-file at deploy time from terraform output
  storage: 5Gi
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

keyVault:
  enabled: false

operations:
  enabled: true
  # RBAC objects are bootstrapped once by an administrative identity
  # (see terraform-gcp/ and AUTONOMOUS_MIGRATION_REPORT.md), not by the
  # GitHub Actions deploy service account, which only holds
  # roles/container.developer (no cluster-scoped RBAC permissions).
  manageRbac: false

livenessProbe:
  httpGet:
    path: /healthz
    port: http

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
