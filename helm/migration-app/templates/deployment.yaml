apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "migration-app.fullname" . }}
  labels:
    {{- include "migration-app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "migration-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "migration-app.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "migration-app.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DB_HOST
              value: "migration-postgresql"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ .Values.postgresql.database | quote }}
            - name: DB_USER
              value: {{ .Values.postgresql.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecretName }}
                  key: POSTGRES_PASSWORD
            {{- if .Values.operations.enabled }}
            - name: ENV_NAME
              value: {{ .Values.environment | quote }}
            - name: BANNER
              value: "Kubernetes Operations Console"
            - name: SESSION_MINUTES
              value: {{ .Values.operations.sessionMinutes | quote }}
            - name: TARGET_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: TARGET_DEPLOYMENT
              value: {{ .Values.operations.targetDeployment | quote }}
            - name: MAX_REPLICAS
              value: {{ .Values.operations.maxReplicas | quote }}
            - name: DEMO_MINUTES
              value: {{ .Values.operations.demoMinutes | quote }}
            - name: DEMO_INTERVAL_SECONDS
              value: {{ .Values.operations.demoIntervalSeconds | quote }}
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOGIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: migration-ops-secret
                  key: LOGIN_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: migration-ops-secret
                  key: JWT_SECRET
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.keyVault.enabled }}
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
          {{- end }}
      {{- if .Values.keyVault.enabled }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "migration-app.fullname" . }}-keyvault
      {{- end }}
