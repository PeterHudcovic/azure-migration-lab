apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: migration-postgresql

spec:
  serviceName: migration-postgresql
  replicas: 1

  selector:
    matchLabels:
      app: migration-postgresql

  template:
    metadata:
      labels:
        app: migration-postgresql
        {{- if .Values.keyVault.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}

    spec:
      serviceAccountName: {{ include "migration-app.serviceAccountName" . }}

      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}

            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecretName }}
                  key: POSTGRES_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          {{- with .Values.postgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

            {{- if .Values.keyVault.enabled }}
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            {{- end }}

      {{- if .Values.keyVault.enabled }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "migration-app.fullname" . }}-keyvault
      {{- end }}

  volumeClaimTemplates:
    - metadata:
        name: postgres-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}