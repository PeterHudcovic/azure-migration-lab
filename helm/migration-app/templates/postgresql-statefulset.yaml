apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: migration-postgresql

spec:
  serviceName: migration-postgresql
  replicas: 1

  selector:
    matchLabels:
      app: migration-postgresql

  template:
    metadata:
      labels:
        app: migration-postgresql

    spec:
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}

            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: migration-postgresql-secret
                  key: POSTGRES_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}