replicaCount: 2

image:
  repository: acrmigrationlab.azurecr.io/migration-app
  pullPolicy: IfNotPresent
  tag: "v2"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

containerPort: 8000

databaseSecretName: migration-postgresql-secret

postgresql:
  enabled: true
  image: postgres:16
  database: migrationdb
  username: migrationuser
  password: ""
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

keyVault:
  enabled: false
  name: ""
  clientId: ""
  tenantId: ""

operations:
  enabled: false
  # Whether this chart's own Helm release manages the operations Role/
  # RoleBinding/ClusterRole/ClusterRoleBinding (templates/operations-rbac.yaml).
  # Separate from `enabled` so a deploy identity with no cluster-scoped RBAC
  # permissions can still run the regular application Helm upgrade - see
  # values-gcp.yaml, where this is set to false and the RBAC objects are
  # applied once, out of band, by an administrative identity instead.
  manageRbac: true

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http

readinessProbe:
  httpGet:
    path: /readyz
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}