# GCP clone: ingress-nginx is now installed (see
# helm/migration-app/values-gcp.yaml comment), so pong is reachable at
# /pong on the same ingress-nginx-controller public IP as the console,
# matching the Azure prod topology. Base values.yaml's ingress block
# (className nginx, rewrite-target regex, path /pong(/|$)(.*)) already
# has no host restriction on its first rule, so no override is needed here
# except turning off the Azure-only host/TLS rule below - there is no DNS
# name or certificate for this ingress on GCP, only the raw external IP.
ingress:
  azureHost: ""

replicaCount: 1

image:
  repository: europe-west1-docker.pkg.dev/migration-lab-gcp-clone/migration-lab/pong-app
  tag: "content-1788917220"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 10m
    memory: 20Mi
  limits:
    cpu: 100m
    memory: 64Mi
