{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: pong-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"

spec:
  ingressClassName: nginx

  {{- if .Values.ingress.azureHost }}
  tls:
    - hosts:
        - {{ .Values.ingress.azureHost }}
      secretName: ops-peterhudcovic-tech-tls
  {{- end }}

  rules:
    - http:
        paths:
          - path: /pong(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pong-app
                port:
                  number: 80
    {{- if .Values.ingress.azureHost }}
    - host: {{ .Values.ingress.azureHost }}
      http:
        paths:
          - path: /pong(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pong-app
                port:
                  number: 80
    {{- end }}
{{- end }}