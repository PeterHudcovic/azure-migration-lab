{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: pong-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"

spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - ops.peterhudcovic.tech
      secretName: ops-peterhudcovic-tech-tls

  rules:
    - http:
        paths:
          - path: /pong(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pong-app
                port:
                  number: 80
    - host: ops.peterhudcovic.tech
      http:
        paths:
          - path: /pong(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pong-app
                port:
                  number: 80
{{- end }}