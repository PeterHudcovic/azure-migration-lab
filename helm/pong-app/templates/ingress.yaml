apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: pong-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /pong(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pong-app
                port:
                  number: 80